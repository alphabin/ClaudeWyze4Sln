<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#000">
<title>The Queen's Eye</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
<style>
:root{--gold:#c9a24d;--gold2:#f2d27a;--ink:#f0e6d0;--muted:#b7a9c4;--red:#e0483c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#000;color:var(--ink);font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
/* viewfinder */
#stage{position:relative;flex:1;background:#000;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;transform-origin:center;transition:transform .15s}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}#flash.on{opacity:.7;transition:none}
/* top bar */
#top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);z-index:3}
#top h1{font-family:Cinzel,serif;font-size:13px;letter-spacing:.18em;color:var(--gold2);flex:1;white-space:nowrap}
.badge{padding:5px 11px;border-radius:999px;background:rgba(10,8,20,.75);border:1px solid rgba(217,182,91,.5);color:var(--gold2);font-family:Cinzel,serif;font-size:10px;letter-spacing:.18em}
.badge i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#666;margin-right:6px}.badge.on i{background:var(--red);box-shadow:0 0 8px var(--red)}
#switch{padding:6px 11px;border-radius:999px;border:1px solid rgba(217,182,91,.5);background:rgba(10,8,20,.75);color:var(--gold2);font-size:11px;font-family:Cinzel,serif;letter-spacing:.08em}
/* toast */
#toast{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 58px);z-index:3;padding:10px 14px;border-radius:12px;background:rgba(12,8,20,.82);border:1px solid rgba(201,162,77,.4);backdrop-filter:blur(8px);transition:opacity .3s}
#toast b{display:block;font-family:Cinzel,serif;font-size:11px;letter-spacing:.2em;color:var(--gold2);margin-bottom:2px}#toast span{font-size:14px;line-height:1.35}
#toast.reading b:after{content:"";display:inline-block;width:8px;height:8px;margin-left:8px;border-radius:50%;border:2px solid var(--gold2);border-top-color:transparent;animation:spin .8s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
/* bottom controls */
#ctl{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:14px 20px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;align-items:center;gap:16px;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent)}
#zooms{display:flex;gap:8px}#zooms button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(20,14,28,.7);color:#fff;font-size:13px;font-weight:600}#zooms button.sel{background:var(--gold2);color:#2a0b1a;border-color:var(--gold2)}
#bar{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:360px}
#stop{width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(20,14,28,.7);color:#fff;font-size:12px}
#shutter{width:84px;height:84px;border-radius:50%;border:5px solid #fff;background:radial-gradient(circle,#f2d27a 55%,#a97b23 100%);box-shadow:0 0 0 3px rgba(0,0,0,.6),0 10px 30px rgba(0,0,0,.6)}#shutter:active{transform:scale(.92)}#shutter:disabled{filter:grayscale(1);opacity:.4}
#last{width:56px;height:56px;border-radius:12px;border:2px solid var(--gold);background:#111 center/cover;overflow:hidden}
/* start screen */
#start{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 30%,#2a1730,#0b0710 70%);padding:30px;text-align:center}
#start h2{font-family:Cinzel,serif;font-size:22px;letter-spacing:.2em;color:var(--gold2)}#start p{color:var(--muted);font-size:14px;line-height:1.5;max-width:320px}
.modes-big{display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px}.modes-big .mode{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px 18px;border-radius:16px;border:2px solid var(--gold);background:linear-gradient(180deg,#2a1730,#170c1f);text-align:left;text-transform:none;letter-spacing:0;white-space:normal}.modes-big .mode b{font-family:Cinzel,serif;font-size:18px;color:var(--gold2);letter-spacing:.06em}.modes-big .mode span{font-family:-apple-system,system-ui,sans-serif;font-size:13px;line-height:1.4;color:var(--ink);font-weight:400}
#start.hide{display:none}
/* verdict sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.8,.2,1);background:linear-gradient(180deg,#22132f,#12091a);border-top:2px solid var(--gold);border-radius:22px 22px 0 0;padding:14px 18px calc(env(safe-area-inset-bottom) + 18px)}
#sheet.on{transform:none}
#sheet .grip{width:44px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin:0 auto 12px}
#sheet .row{display:flex;gap:14px;align-items:flex-start}
#sheet img{width:74px;height:104px;object-fit:cover;border-radius:6px;border:1px solid var(--gold);background:#000;flex:none}
#sheet b{font-family:Cinzel,serif;font-size:19px;color:var(--ink);display:block}
#sheet .p{font-family:Cinzel,serif;color:var(--gold2);font-size:15px;margin-top:4px}#sheet .v{font-size:14px;line-height:1.4;color:var(--ink);margin-top:8px}
#sheet .chips{display:flex;gap:8px;margin-top:12px}#sheet .chips button{flex:1;padding:11px 6px;border-radius:999px;border:1px solid var(--gold);background:transparent;color:var(--gold2);font-size:12px}#sheet .chips button.x{border-color:rgba(255,255,255,.3);color:#fff}
</style></head><body><div id="app">
<div id="stage"><video id="v" autoplay muted playsinline></video><div id="flash"></div>
  <div id="top"><h1 id="modename">✦ CARDS</h1><span class="badge" id="badge"><i></i>OFF</span><button id="switch">switch mode</button></div>
  <div id="toast"><b id="t1">READY</b><span id="t2">Fill the picture with a card and press the shutter.</span></div>
  <div id="ctl"><div id="zooms"><button data-z="1" class="sel">1×</button><button data-z="2">2×</button><button data-z="3">3×</button></div>
    <div id="bar"><button id="stop">stop</button><button id="shutter" aria-label="snap"></button><div id="last"></div></div></div>
  <div id="sheet"><div class="grip"></div><div class="row"><img id="s-img" alt=""><div><b id="s-name"></b><div class="p" id="s-price"></div></div></div><div class="v" id="s-text"></div>
    <div class="chips"><button id="fix-no">not a holo</button><button id="fix-yes">it is a holo</button><button id="close" class="x">next card</button></div></div>
</div>
<div id="start"><h2>THE QUEEN'S EYE</h2><p>Your phone becomes a camera on the stream. Pick what you are doing:</p>
  <div class="modes-big">
    <button class="mode" data-m="table"><b>🃏 Cards</b><span>Judge cards one by one. Your phone stays off the stream. Snap a card, she names it, prices it and passes judgement.</span></button>
    <button class="mode" data-m="rip"><b>🎴 Rip Night</b><span>Your phone IS the table, live on the stream. Snap cards and boxes, she judges, prices, and heckles the court between packs.</span></button>
    <button class="mode" data-m="eagle"><b>🐍 Live POV</b><span>Your phone is the main picture. Get her best angles. No judging.</span></button>
  </div><p style="font-size:12px">Tap one to start the camera. Keep this page open while you use it.</p></div>
</div>
<canvas id="c" hidden></canvas>
<script>
const WHIP='https://__LAN_IP__:8891/ripcam/whip', AUTH='Basic '+btoa('phone:__RIPCAM_PASSWORD__');
let pc=null, stream=null, on=false, mode='table', busy=0, lastSnap=0, prev=null, still=0, moved=false, lastShotSig=null, zoom=1, nativeZoom=false; const LOADED=Date.now()/1000; let lastPull=LOADED;
const $=id=>document.getElementById(id);
function toast(t,x,cls){ $('t1').textContent=t; $('t2').textContent=x; $('toast').className=cls||''; }
async function start(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}},audio:false});
    $('v').srcObject=stream; pc=new RTCPeerConnection({iceServers:[]});
    stream.getTracks().forEach(t=>pc.addTransceiver(t,{direction:'sendonly'}));
    const offer=await pc.createOffer(); await pc.setLocalDescription(offer);
    await new Promise(r=>{ if(pc.iceGatheringState==='complete') return r(); pc.onicegatheringstatechange=()=>pc.iceGatheringState==='complete'&&r(); setTimeout(r,1500); });
    const res=await fetch(WHIP,{method:'POST',headers:{'Content-Type':'application/sdp','Authorization':AUTH},body:pc.localDescription.sdp});
    if(!res.ok) throw new Error('relay said '+res.status);
    await pc.setRemoteDescription({type:'answer',sdp:await res.text()}); on=true; $('start').classList.add('hide'); ui(); setMode(mode);
    try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(()=>{}); }catch{}
    try{ const cap=stream.getVideoTracks()[0].getCapabilities&&stream.getVideoTracks()[0].getCapabilities(); nativeZoom=!!(cap&&cap.zoom&&cap.zoom.max>=2); }catch{}
    pc.onconnectionstatechange=()=>{ if(['failed','disconnected','closed'].includes(pc.connectionState)&&on){ stop(); toast('LINK DROPPED','Open the table again.'); } };
  }catch(e){ $('start').classList.remove('hide'); toast('COULD NOT START', e.message+(location.protocol!=='https:'?' (needs https)':'')); alert('Could not start: '+e.message); }
}
function stop(){ on=false; try{pc&&pc.close()}catch{} try{stream&&stream.getTracks().forEach(t=>t.stop())}catch{} $('v').srcObject=null; fetch('/cmd',{method:'POST',body:JSON.stringify({stop:true})}).catch(()=>{}); $('start').classList.remove('hide'); $('sheet').classList.remove('on'); ui(); }
function ui(){ $('badge').className='badge'+(on?' on':''); $('badge').innerHTML='<i></i>'+(on?'ON AIR':'OFF'); $('shutter').disabled=!on||mode==='eagle'; }
document.querySelectorAll('.modes-big .mode').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; if(on){ setMode(mode); $('start').classList.add('hide'); } else start(); }); $('switch').onclick=()=>$('start').classList.remove('hide'); $('stop').onclick=stop;
const MODE_TEXT={table:['CARDS','Your phone stays off the stream. Snap each card: she names, prices and judges it.'],rip:['RIP NIGHT','Your phone is LIVE on the stream as the table. Snap cards and boxes: she judges, prices, and heckles the court between packs.'],eagle:['LIVE · POV','Your phone is the main picture. Get her best angles. No judging in this mode.']};
const MODE_NAME={table:'✦ CARDS',rip:'🎴 RIP NIGHT',eagle:'🐍 LIVE POV'};
function setMode(m){ mode=m; $('modename').textContent=MODE_NAME[m]; ui(); $('sheet').classList.remove('on'); fetch('/cmd',{method:'POST',body:JSON.stringify({mode:m})}).catch(()=>{}); toast(MODE_TEXT[m][0],MODE_TEXT[m][1]+(m==='table'?'':' Takes up to 30 s to switch on stream.')); }
// zoom: real camera zoom when the phone has it, otherwise the snapshot is cropped to what you see
document.querySelectorAll('#zooms button').forEach(b=>b.onclick=()=>{ zoom=parseFloat(b.dataset.z); document.querySelectorAll('#zooms button').forEach(x=>x.classList.toggle('sel',x===b)); applyZoom(); });
function applyZoom(){ if(nativeZoom&&stream){ stream.getVideoTracks()[0].applyConstraints({advanced:[{zoom}]}).catch(()=>{}); $('v').style.transform='none'; } else $('v').style.transform='scale('+zoom+')'; }
// the snap: a full-size JPEG straight from the camera, posted to the Mac
async function snap(why){
  if(!on||mode==='eagle'||Date.now()-lastSnap<1200) return; const v=$('v'); if(!v.videoWidth) return; lastSnap=Date.now();
  const c=$('c'); const z=nativeZoom?1:zoom; const sw=v.videoWidth/z, sh=v.videoHeight/z; c.width=Math.round(sw); c.height=Math.round(sh); c.getContext('2d').drawImage(v,(v.videoWidth-sw)/2,(v.videoHeight-sh)/2,sw,sh,0,0,c.width,c.height);
  $('flash').classList.add('on'); setTimeout(()=>$('flash').classList.remove('on'),40); if(navigator.vibrate) navigator.vibrate(30);
  $('last').style.backgroundImage='url('+c.toDataURL('image/jpeg',.5)+')'; $('sheet').classList.remove('on');
  toast('SENT','She has the card ('+why+'). About 12 seconds…','reading');
  c.toBlob(async b=>{ try{ const r=await fetch('/shot',{method:'POST',headers:{'Content-Type':'image/jpeg'},body:b}); if(!r.ok) toast('SNAP FAILED','The Mac said '+r.status); else { const j=await r.json(); if(j.queued>1) toast('QUEUED',j.queued+' cards waiting. She takes them in order, about 12 s each.','reading'); } }catch(e){ toast('SNAP FAILED',e.message);} },'image/jpeg',.92);
}
$('shutter').onclick=()=>snap('shutter');
// auto-snap: after movement, a short hold with something new in frame
const mc=document.createElement('canvas'); mc.width=48; mc.height=36; const mx=mc.getContext('2d',{willReadFrequently:true});
function sig(){ const v=$('v'); if(!v.videoWidth) return null; mx.drawImage(v,0,0,48,36); return mx.getImageData(0,0,48,36).data; }
function diff(a,b){ if(!a||!b) return 0; let s=0; for(let i=0;i<a.length;i+=4) s+=Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2]); return s/(a.length/4)/3; }
setInterval(()=>{ if(!on||mode==='eagle') return; const s=sig(); const d=diff(s,prev); prev=s; if(!s) return;
  if(d>14){ moved=true; still=0; return; }
  if(d<7) still++; else still=0;
  if(moved&&still>=4&&Date.now()-lastSnap>5000&&diff(s,lastShotSig)>10){ moved=false; lastShotSig=s; snap('held steady'); }
},240);
// corrections + what the Mac says
$('fix-no').onclick=()=>fix(false); $('fix-yes').onclick=()=>fix(true); $('close').onclick=()=>{ $('sheet').classList.remove('on'); toast('CARD TABLE','Next card: fill the picture and press the shutter.'); };
function fix(h){ fetch('/cmd',{method:'POST',body:JSON.stringify({holo:h})}).catch(()=>{}); toast('CORRECTED', h?'Told her it is a holo.':'Told her it is not a holo.'); $('sheet').classList.remove('on'); }
let reading=false;
async function poll(){ try{ const s=await (await fetch('/status',{cache:'no-store'})).json();
  const p=s.pull; const mine=p&&p.ts&&p.ts>LOADED; const r=s.ripcam||{};
  if(on&&!r.live) toast('CONNECTING','Cleo is picking up the stream (up to 30 s)…','reading');
  else if(on&&r.live&&$('t1').textContent==='CONNECTING') toast('CARD TABLE','Fill the picture with a card and press the shutter.');
  if(mine&&p.stage==='reading'&&Date.now()/1000-p.ts<90&&!reading){ reading=true; toast('READING',(s.queue>0?s.queue+' more waiting. ':'')+'She has the card. Give her a few seconds…','reading'); }
  if(mine&&p.ts!==lastPull&&p.stage!=='reading'){ lastPull=p.ts; reading=false;
    if(p.stage==='none'){ toast('NO CARD','She saw no card in that. Fill the picture and try again.'); return; }
    $('s-img').src='/pull-image?'+p.ts; $('s-name').textContent=(p.name||'')+(p.holo?' ✦ holo':''); $('s-price').textContent=p.value?('the ledgers whisper · '+p.value):''; $('s-text').textContent=p.verdict||''; $('sheet').classList.add('on'); toast('JUDGED',p.name||'');
  }
 }catch{} }
setInterval(poll,1500); ui();
</script></body></html>
