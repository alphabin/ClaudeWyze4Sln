# v4-quickstream local relay (runs natively on the host, not in Docker). Copied from ../relay/mediamtx.yml.
# A headless Chrome decodes the Pan V4's H.265 Agora stream and re-publishes it here
# over WHIP; OBS/VLC/Home Assistant pull it back out as RTSP (:8555) or WebRTC (:8890).  Ports chosen not to clash with the
# bridge's own MediaMTX (8554/8888/8889) or macOS AirPlay (5000/7000).
logLevel: info
logDestinations: [stdout]

api: no
metrics: no
pprof: no
playback: no

rtsp: yes
rtspAddress: :8555
rtspTransports: [tcp]
rtspEncryption: "no"

rtmp: no
hls: no
srt: no
moq: no

webrtc: yes
webrtcAddress: :8890
webrtcEncryption: no
webrtcAllowOrigin: "*"
webrtcLocalUDPAddress: :8190
webrtcLocalTCPAddress: :8190
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts: [127.0.0.1]
webrtcICEServers2: []

pathDefaults:
  source: publisher
  sourceOnDemand: no

paths:
  all_others:
