# Local video relay for snakecam (runs natively on the Mac, not in Docker).
# A headless Chrome decodes the Pan V4's H.265 Agora stream and re-publishes it here
# over WHIP; OBS pulls it back out as plain RTSP.  Ports chosen not to clash with the
# bridge's own MediaMTX (8554/8888/8889) or macOS AirPlay (5000/7000).
logLevel: info
logDestinations: [stdout]

api: no
metrics: no
pprof: no
playback: no

rtsp: yes
rtspAddress: 127.0.0.1:8555      # loopback only: OBS and the bot's ffmpeg are on this Mac
rtspTransports: [tcp]
rtspEncryption: "no"

rtmp: no
hls: no
srt: no
moq: no

webrtc: yes
webrtcAddress: 127.0.0.1:8890    # WHIP publishers are the two headless Chromes on this Mac
webrtcEncryption: no
webrtcAllowOrigin: "*"
webrtcLocalUDPAddress: 127.0.0.1:8190
webrtcLocalTCPAddress: 127.0.0.1:8190
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts: [127.0.0.1]
webrtcICEServers2: []

# Even on loopback: only this Mac may publish or read (a rogue publisher would replace the live picture on Twitch).
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: publish
      - action: read

pathDefaults:
  source: publisher
  sourceOnDemand: no

paths:
  all_others:
