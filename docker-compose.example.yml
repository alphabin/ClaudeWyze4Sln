services:
  wyze-bridge:
    container_name: wyze-bridge
    image: mrlt8/wyze-bridge:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:5000"   # web UI  -> http://localhost:5050  (5000 is taken by macOS AirPlay)
      - "127.0.0.1:8554:8554"   # RTSP    -> what ffmpeg pulls from
      - "127.0.0.1:8888:8888"   # HLS     -> handy for testing in a browser
    environment:
      WYZE_EMAIL: <see .env>
      WYZE_PASS: <see .env>
      API_ID:        ${WYZE_API_ID}
      API_KEY: <see .env>
      # LAN = pull video directly from the cameras over your own network.
      # Never falls back to Wyze's relay servers, which are bandwidth-capped
      # and will not survive 24/7 use.
      NET_MODE:  ANY
      # Video now comes via WebRTC (Wyze cloud), not the direct camera protocol, which
      # cannot work from inside the Docker VM. Only try direct when an RTSP client asks.
      ON_DEMAND: "True"
      # HD<n> where n is kB/s, 30-255. 180 ~= 1.4Mbps, a sane 1080p/wifi tradeoff.
      QUALITY:   HD180
      # No auth on RTSP: nothing outside this Mac can reach port 8554 anyway,
      # and ffmpeg would otherwise need credentials in the URL.
      WB_AUTH:   "False"
    volumes:
      - ./token: <see .env>
      # Whole folder (not single files: Docker keeps serving a replaced file's old copy). Served at :5050/static/snakecam/
      #   cam.html  = Kinesis WebRTC player (hot cam)      lake.html = Agora player (cool cam)
      #   lake/*.json = sessions from the provisioner      agora-rtc-sdk.js = Agora SDK served locally
      - ./overlay:/app/static/snakecam:ro

  # Sidecar: asks Wyze's cloud for the Agora ("lake") session the web viewer uses, for cameras
  # the bridge cannot reach directly (Pan V4). Shares the bridge's saved login; renews hourly.
  lake-provisioner:
    container_name: lake-provisioner
    image: mrlt8/wyze-bridge:latest
    restart: unless-stopped
    entrypoint: ["python3", "/lake/provision.py"]
    ports:
      - "127.0.0.1:5051:5051"   # on-demand session endpoint: the player POSTs /provision/<cam> on every start
    environment:
      LAKE_CAMS: "Snake Cam Cool,Hot Hide Cam,Cold Hide Cam"      # comma-separated nicknames; empty = every camera Wyze marks as "lake"
      RENEW_EVERY: "2700"
    volumes:
      - ./token: <see .env>
      - ./lake:/lake:ro
      - ./overlay/lake:/out
    depends_on:
      - wyze-bridge
